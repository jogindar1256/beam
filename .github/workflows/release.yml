# Builds Beam for Windows and Mac on GitHub's own machines.
#  - Every push / pull request: run all tests (including the desktop app test).
#  - Pushing a tag like v2.0.1: build installers, sign them if certificates are
#    configured, and upload them to a DRAFT GitHub Release. Publish the draft to ship;
#    installed copies then auto-update to it.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:quick
      - run: node test/network.test.js
      - run: node test/e2e.js
      - name: Desktop app test (virtual display)
        # The test itself now tolerates the test tool's occasional dropped reply
        # (verified by outcome). One re-run remains as a last safety net; a real app
        # bug fails both runs, and each failure names the exact test line.
        run: xvfb-run -a npm run test:app || (echo "::warning::Desktop app test failed once; re-running" && xvfb-run -a npm run test:app)

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Tag must match package.json version
        shell: bash
        run: |
          want="v$(node -p 'require("./package.json").version')"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then echo "::error::Tag $GITHUB_REF_NAME but package.json says $want"; exit 1; fi

      - name: Build, sign, publish (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No Apple certificate configured: building an UNSIGNED Mac app. Users will have to right-click > Open, and auto-update will not work on Mac."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish always -c.mac.identity=- -c.mac.notarize=false
          else
            npx electron-builder --mac --publish always -c.mac.notarize=true
          fi

      - name: Build, sign, publish (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No Windows certificate configured: building an UNSIGNED installer. SmartScreen will warn users."
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          npx electron-builder --win --publish always
